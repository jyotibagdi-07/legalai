<!-- analyzer.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LegalDocsAI — Analyzer</title>
  <link rel="stylesheet" href="css/styleanylser.css">
  <script src="js/api.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">G</div>
      <div class="brand-text">
        <div class="title">LegalDocsAI</div>
        <div class="subtitle">AI Powered PDF Analysis</div>
      </div>
    </div>

    <div class="controls">
      <label class="upload-btn">
        <input id="fileInput" type="file" accept="application/pdf" />
        Upload PDF
      </label>
      <button id="analyzeBtn" class="primary" disabled>Analyze</button>
    </div>
  </div>

  <main class="container">
    <section class="viewer">
      <div class="doc-header">Document: <span id="docName">No file selected</span></div>
      <div class="preview">
        <iframe id="pdfFrame" src="" frameborder="0"></iframe>
        <div id="noPreview" class="no-preview">Choose or upload a PDF to preview</div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="card summary">
        <div class="card-title">Summary & Key Findings</div>
        <div id="sentiment" class="sentiment">Sentiment: —</div>
        <ul id="summaryBullets" class="bullets">
        </ul>
      </div>

      <div class="card clauses">
        <div class="card-title">Clause Breakdown</div>
        <div id="clauseList" class="clause-list"></div>
      </div>

      <div class="card timeline">
        <div class="card-title">Timeline of Events</div>
        <div id="timelineContent">
          <div><strong>Draft:</strong> —</div>
          <div><strong>Signing:</strong> —</div>
          <div><strong>Expiry:</strong> —</div>
        </div>
      </div>

      <div class="card actions">
        <button id="reportBtn" class="primary" disabled>Generate Report (PDF/DOCX)</button>
        <button id="shareBtn">Share Analysis</button>
      </div>
    </aside>
  </main>

  <footer class="footer">Upload a PDF and click Analyze to run the live backend.</footer>

  <script>
    // DOM hooks
    const fileInput = document.getElementById('fileInput');
    const pdfFrame = document.getElementById('pdfFrame');
    const noPreview = document.getElementById('noPreview');
    const docName = document.getElementById('docName');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const reportBtn = document.getElementById('reportBtn');
    const shareBtn = document.getElementById('shareBtn');

    let currentFile = null;

    fileInput.addEventListener('change', (ev) => {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      currentFile = f;
      docName.textContent = f.name;
      const url = URL.createObjectURL(f);
      pdfFrame.src = url;
      pdfFrame.style.display = 'block';
      noPreview.style.display = 'none';
      analyzeBtn.disabled = false;
      reportBtn.disabled = false;
    });

    analyzeBtn.addEventListener('click', async () => {
      if (currentFile) {
        // Upload and analyze real file
        analyzeBtn.disabled = true;
        const originalText = analyzeBtn.textContent;
        analyzeBtn.textContent = "Analyzing...";
        
        try {
          const result = await legalAiAnalyzeFile(currentFile);
          console.log("Analysis results:", result);
          
          sessionStorage.setItem('analyzedFileName', currentFile.name);
          sessionStorage.setItem('analysisResult', JSON.stringify(result));
          
          showAnalysis(result);
          alert("✅ Document analysis complete!");
          
        } catch (error) {
          console.error("Backend Error:", error);
          alert("❌ Analysis failed. Make sure the backend server is running on port 8016.");
        } finally {
          analyzeBtn.disabled = false;
          analyzeBtn.textContent = originalText;
        }
      } else {
        alert("Please upload a PDF first.");
      }
    });

    reportBtn.addEventListener('click', () => {
      window.print();
    });

    shareBtn.addEventListener('click', () => {
      // Copy sharing data to clipboard
      const file = sessionStorage.getItem('analyzedFileName') || "agreement-between-a-manufacturer-and-selling-agent.pdf";
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert("✅ Analysis link copied to clipboard! (Share with your team)");
      }).catch(err => {
        alert("Could not copy link to clipboard: " + err);
      });
    });

    function showAnalysis(a) {
      // Sentiment
      const sentimentDiv = document.getElementById('sentiment');
      sentimentDiv.innerHTML = `Sentiment: <strong>${a.sentiment}</strong> (${a.sentiment_score}%)`;

      // Summary bullets
      const ul = document.getElementById('summaryBullets');
      ul.innerHTML = '';
      
      const numObligations = a.obligations ? a.obligations.length : 0;
      const numRisks = a.risks ? a.risks.length : 0;
      const numAmbiguous = a.ambiguous ? a.ambiguous.length : 0;
      
      const bullets = [
        `Identified ${numObligations} core obligations`,
        `Flagged ${numRisks} potential risks`,
        `Found ${numAmbiguous} ambiguous clauses`
      ];
      bullets.forEach(b => {
        const li = document.createElement('li'); li.textContent = b; ul.appendChild(li);
      });

      // Clause listing
      const clDiv = document.getElementById('clauseList');
      clDiv.innerHTML = '';
      if (a.clauses && a.clauses.length > 0) {
        a.clauses.forEach(c => {
          const el = document.createElement('div');
          el.className = 'clause-item';
          el.innerHTML = `<div class="clause-name">${c.name}</div>
                          <div class="clause-right">
                            <span class="risk ${c.risk.toLowerCase()}">${c.risk} Risk</span>
                            <div class="clause-detail">${c.detail}</div>
                          </div>`;
          clDiv.appendChild(el);
        });
      } else {
        clDiv.innerHTML = "<div>No clauses found.</div>";
      }

      // Timeline
      const tl = document.getElementById('timelineContent');
      const draftVal = a.timeline?.draft || "—";
      const signingVal = a.timeline?.signing || "—";
      const expiryVal = a.timeline?.expiry || "—";
      tl.innerHTML = `<div><strong>Draft:</strong> ${draftVal}</div>
                      <div><strong>Signing:</strong> ${signingVal}</div>
                      <div><strong>Expiry:</strong> ${expiryVal}</div>`;

      // Append recommendations
      if (a.recommendations && a.recommendations.length > 0) {
        const summaryCard = document.querySelector('.summary');
        
        // Remove existing if present to avoid duplication
        const existingTitle = document.querySelector('.rec-title');
        const existingList = document.querySelector('.rec-list');
        if (existingTitle) existingTitle.remove();
        if (existingList) existingList.remove();
        
        const recTitle = document.createElement('div');
        recTitle.className = 'rec-title';
        recTitle.textContent = 'Recommendations';
        
        const recList = document.createElement('ul');
        recList.className = 'rec-list';
        a.recommendations.forEach(r => {
          const li = document.createElement('li'); li.textContent = r; recList.appendChild(li);
        });
        
        summaryCard.appendChild(recTitle);
        summaryCard.appendChild(recList);
      }
    }

    // Auto-load analysis on page load if it was analyzed earlier
    document.addEventListener("DOMContentLoaded", () => {
      const storedResult = sessionStorage.getItem('analysisResult');
      const storedFileName = sessionStorage.getItem('analyzedFileName');
      if (storedResult && storedFileName) {
        try {
          const resultObj = JSON.parse(storedResult);
          docName.textContent = storedFileName;
          showAnalysis(resultObj);
          reportBtn.disabled = false;
          noPreview.textContent = `File "${storedFileName}" analyzed. Upload a new PDF to preview and analyze.`;
        } catch (e) {
          console.error("Error loading stored analysis:", e);
        }
      } else {
        docName.textContent = "No file selected";
      }
    });

  </script>
</body>
</html>
